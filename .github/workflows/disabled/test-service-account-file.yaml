name: Test setup-bclone/service-account-file
on:
  push:
    paths:
      - service-account-file/action.yaml
      - .github/workflows/test-service-account-file.yaml
      
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: [latest, "${{ vars.SPECIFIED_VERSION }}"]
        
    steps:
      - name: Setup bclone using setup-bclone
        uses: BenjiThatFoxGuy/setup-bclone@main
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG_SERVICE_ACCOUNT_FILE_TEST }}
          version: ${{ matrix.version }}
          
      - name: Add bclone service account file using setup-bclone/service-account-file
        uses: BenjiThatFoxGuy/setup-bclone/service-account-file@main
        with:
          service_account_filename: setup-bclone-test.json
          service_account_file: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
          
      - name: Test bclone by listing remotes
        run: rclone listremotes
        
      - name: Test bclone by listing test remote
        run: 'rclone lsd setup-bclone-test:'