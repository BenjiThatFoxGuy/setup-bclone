# Checks that the action can download and install bclone, both releases that
# ship bclone-*.zip and older ones that ship rclone-*.zip. Needs no secrets.
name: Test download
on:
  pull_request:
    paths:
      - action.yml
      - scripts/**
      - .github/workflows/test-download.yaml
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        version: [latest, v1.75.3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bclone
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Both command names work
        shell: bash
        run: |
          rclone version
          bclone version
